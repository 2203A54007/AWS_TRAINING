<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <form class="glass-form">
        <h3>Sign Up</h3>
        
        <div class="input-group">
            <input type="text" id="fullname" required autocomplete="off">
            <label for="fullname">Full Name</label>
        </div>

        <div class="input-group">
            <input type="email" id="email" required autocomplete="off">
            <label for="email">Email Address</label>
        </div>

        <div class="input-group">
            <input type="tel" id="phone" required autocomplete="off">
            <label for="phone">Phone Number</label>
        </div>

        <div class="input-group">
            <input type="password" id="password" required autocomplete="off">
            <label for="password">Password</label>
        </div>

        <div class="input-group">
            <input type="password" id="confirm_password" required autocomplete="off">
            <label for="confirm_password">Confirm Password</label>
        </div>

        <button type="submit">Create Account</button>
        
        <div class="footer">
            Already a member? <a href="#">Log In Here</a>
        </div>
    </form>

</body>
</html>
